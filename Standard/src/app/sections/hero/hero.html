<section id="inicio" class="hero">
  <img
    class="hero__bg"
    [src]="config.business.heroImage"
    [alt]="config.business.heroImageAlt"
    width="1923"
    height="976"
    fetchpriority="high"
  />

  <div class="hero__inner">
    <div class="hero__copy">
      <span class="hero__kind">{{ config.business.kind }}</span>
      <h1 class="hero__title">{{ config.business.name }}</h1>
      <p class="hero__tagline">{{ config.business.tagline }}</p>

      <div class="hero__actions">
        <button class="btn btn--gold" type="button" (click)="goTo('reserva')">Reservar mesa</button>
        <button class="btn btn--ghost" type="button" (click)="goTo('carta')">Ver la carta</button>
      </div>
    </div>

    <img
      class="hero__logo"
      [src]="config.business.logo"
      alt="Logotipo de El Olmo Centenario, Irish Tavern"
      width="616"
      height="521"
    />
  </div>
</section>
