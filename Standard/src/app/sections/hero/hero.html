<section id="inicio" class="hero">
  <div class="hero__inner">
    <div class="hero__copy">
      <span class="hero__kind">{{ config.business.kind }}</span>
      <h1 class="hero__title">{{ config.business.name }}</h1>
      <p class="hero__tagline">{{ config.business.tagline }}</p>

      <div class="hero__actions">
        <button class="btn btn--fire" type="button" (click)="goTo('reserva')">Reservar mesa</button>
        <button class="btn btn--ghost" type="button" (click)="goTo('carta')">Ver la carta</button>
      </div>
    </div>

    <div class="hero__media">
      <img
        class="hero__photo hero__photo--main"
        [src]="config.business.heroImages.main"
        [alt]="config.business.heroImages.alt"
        width="544"
        height="481"
        fetchpriority="high"
      />
      <img
        class="hero__photo hero__photo--secondary"
        [src]="config.business.heroImages.secondary"
        [alt]="config.business.heroImages.secondaryAlt"
        width="560"
        height="403"
      />
      <div class="hero__sticker" aria-label="Menú del día 10,50 euros, martes a viernes">
        <span>{{ config.menu.menuDelDia.title }}</span>
        <strong>{{ config.menu.menuDelDia.price }}</strong>
        <span>{{ config.menu.menuDelDia.days }}</span>
      </div>
    </div>
  </div>
</section>
