<section id="visitanos" class="visit">
  <div class="visit__inner">
    <div class="visit__photo">
      <img
        [src]="config.visit.image"
        [alt]="config.visit.imageAlt"
        loading="lazy"
        width="541"
        height="519"
      />
    </div>

    <div class="visit__info">
      <app-section-heading
        eyebrow="Visítanos"
        [title]="config.visit.title"
        [subtitle]="config.visit.subtitle"
        align="left"
      />

      <ul class="visit__details">
        @if (config.contact.address) {
          <li>
            <mat-icon>place</mat-icon>
            <span>{{ config.contact.address }}</span>
          </li>
        }
        @if (config.contact.phone) {
          <li>
            <mat-icon>call</mat-icon>
            <a [href]="'tel:' + config.contact.phone">{{ config.contact.phone }}</a>
          </li>
        }
        @if (config.contact.hours) {
          <li>
            <mat-icon>schedule</mat-icon>
            <span>{{ config.contact.hours }}</span>
          </li>
        }
      </ul>

      <div class="visit__actions">
        <button class="btn btn--gold" type="button" (click)="goTo('reserva')">Reservar mesa</button>
        @if (directionsUrl) {
          <a
            class="btn btn--ghost"
            [href]="directionsUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            <mat-icon>directions</mat-icon>
            Cómo llegar
          </a>
        }
      </div>
    </div>
  </div>

  @if (mapEmbedUrl) {
    <div class="visit__map">
      <iframe
        [src]="mapEmbedUrl"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Mapa de ubicación"
      ></iframe>
    </div>
  }
</section>
