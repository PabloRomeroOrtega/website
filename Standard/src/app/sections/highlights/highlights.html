<section class="highlights" aria-label="Por qué venir">
  <ul class="highlights__inner">
    @for (item of config.highlights; track item.title) {
      <li class="highlights__item">
        <mat-icon>{{ item.icon }}</mat-icon>
        <div>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </li>
    }
  </ul>
</section>
