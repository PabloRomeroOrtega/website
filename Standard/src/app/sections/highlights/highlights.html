<section class="highlights">
  <div class="highlights__inner">
    @for (item of config.highlights; track item.title) {
      <div class="highlights__item">
        <div class="highlights__icon">
          <mat-icon>{{ item.icon }}</mat-icon>
        </div>
        <div>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </div>
    }
  </div>
</section>
