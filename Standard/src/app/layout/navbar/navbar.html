<mat-toolbar class="navbar" [class.navbar--scrolled]="isScrolled()">
  <div class="navbar__inner">
    <button class="navbar__brand" type="button" (click)="goTo('inicio')">
      <mat-icon>{{ config.business.logoIcon }}</mat-icon>
      <span>{{ config.business.shortName }}</span>
    </button>

    <nav class="navbar__links">
      @for (link of config.nav; track link.sectionId) {
        <button mat-button type="button" (click)="goTo(link.sectionId)">{{ link.label }}</button>
      }
    </nav>

    <div class="navbar__actions">
      @if (config.reservation.enabled) {
        <button mat-flat-button color="primary" type="button" (click)="goTo('reserva')">
          Reservar mesa
        </button>
      }

      <button
        class="navbar__menu-trigger"
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="mobileMenu"
        aria-label="Abrir menú de navegación"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu">
  @for (link of config.nav; track link.sectionId) {
    <button mat-menu-item type="button" (click)="goTo(link.sectionId)">{{ link.label }}</button>
  }
  @if (config.reservation.enabled) {
    <button mat-menu-item type="button" (click)="goTo('reserva')">
      <mat-icon>event_available</mat-icon>
      <span>Reservar Mesa</span>
    </button>
  }
</mat-menu>
