<header class="navbar" [class.navbar--scrolled]="isScrolled()">
  <div class="navbar__inner">
    <button
      class="navbar__brand"
      type="button"
      (click)="goTo('inicio')"
      aria-label="El Olmo Centenario, ir al inicio"
    >
      <img class="navbar__logo" [src]="config.business.logo" alt="" width="48" height="48" />
      <span>{{ config.business.shortName }}</span>
    </button>

    <nav class="navbar__links" aria-label="Principal">
      @for (link of config.nav; track link.sectionId) {
        <button type="button" (click)="goTo(link.sectionId)">{{ link.label }}</button>
      }
    </nav>

    <div class="navbar__actions">
      <button class="btn btn--gold navbar__cta" type="button" (click)="goTo('reserva')">
        Reservar
      </button>

      <button
        class="navbar__menu-trigger"
        type="button"
        [matMenuTriggerFor]="mobileMenu"
        aria-label="Abrir menú de navegación"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </div>
</header>

<mat-menu #mobileMenu="matMenu">
  @for (link of config.nav; track link.sectionId) {
    <button mat-menu-item type="button" (click)="goTo(link.sectionId)">{{ link.label }}</button>
  }
</mat-menu>
