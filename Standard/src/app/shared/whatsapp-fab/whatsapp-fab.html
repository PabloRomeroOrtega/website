@if (whatsappLink) {
  <a
    class="whatsapp-fab"
    [href]="whatsappLink"
    target="_blank"
    rel="noopener noreferrer"
    matTooltip="Chatea con nosotros"
    matTooltipPosition="left"
  >
    <button mat-fab extended color="primary" type="button">
      <mat-icon>chat</mat-icon>
      Escríbenos
    </button>
  </a>
}
